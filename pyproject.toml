[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spongecake-autoreport"
version = "0.2.0"
description = "Daily PDF + HTML LSE-stock research report with technical indicators, forecasts, and LLM commentary"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Jon Hammant" },
]
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "weasyprint>=62",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "requests>=2.31",
    "plotly>=5.20",
    "anthropic>=0.40",
    "flask>=3.0",
]

[project.optional-dependencies]
chronos = [
    "torch>=2.2",
    "chronos-forecasting>=1.4",
]
bridge = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.scripts]
spongecake-report = "spongecake_autoreport.cli:main"
spongecake-bridge = "spongecake_autoreport.chronos_bridge:main"
spongecake-viewer = "spongecake_autoreport.viewer:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spongecake_autoreport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
